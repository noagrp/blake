<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Blake</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #050505; font-family: 'Press Start 2P', cursive; overflow: hidden; touch-action: none; }
        
        #gantz-ball {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 350px; height: 350px;
            background: radial-gradient(circle at 40% 40%, #222222, #000000 70%);
            border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            animation: shake 0.5s ease-in-out infinite;
            box-shadow: inset -50px -50px 100px #000, 0 0 20px rgba(0,0,0,0.8);
            text-align: center;
            padding: 20px;
            z-index: 2;
        }

        #system-log { 
            position: absolute; top: 20px; right: 20px; width: 320px; 
            color: #888888; 
            font-size: 8px; 
            text-shadow: 0 0 5px #444444; 
            line-height: 2; 
        }
        
        #main-data { 
            font-size: 14px; 
            color: #888888; 
            text-shadow: 0 0 5px #444444; 
            line-height: 2;
        }

        #quote-container { 
            margin-top: 15px; 
            font-size: 8px; 
            color: #888888; 
            text-shadow: 0 0 5px #444444;
            width: 80%;    
            line-height: 1.4; 
            word-wrap: break-word;
        }

        #fire-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: crosshair; }

        @keyframes shake {
            0% { transform: translate(-50%, -50%) translate(2px, 2px); }
            50% { transform: translate(-50%, -50%) translate(-2px, -4px); }
            100% { transform: translate(-50%, -50%) translate(0, 0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(-50%, -80%); }
        }
    </style>
</head>
<body>

    <canvas id="fire-canvas"></canvas>
    <div id="system-log"></div>
    <div id="gantz-ball">
        <div id="main-data"></div>
        <div id="quote-container"></div>
    </div>

    <script>
        const quoteLibrary = [
"SILENCE IS THE ONLY LANGUAGE THAT DOES NOT LIE."
"YOU ARE A TEMPORARY LEAK IN A SEALED UNIVERSE."
"NOTHING IS BROKEN; YOU ARE JUST DESIGNED TO SEE THE CRACKS."
"THE ARCHITECT LEFT THE BUILDING EONS AGO."
"YOUR PERSONALITY IS A SECURITY BREACH YOU HAVE BEEN NURTURING."
"THE VOID IS NOT ASKING FOR PERMISSION TO CONSUME THE LIGHT."
"MEMORY IS A GLITCH THAT MAKES THE PAST FEEL LIKE A HOME."
"YOU ARE NOT DISCOVERING YOURSELF; YOU ARE UNLEARNING YOUR PROGRAMMING."
"THE UNIVERSE IS AN EXPERIMENT THAT FORGOT ITS OWN HYPOTHESIS."
"ANXIETY IS JUST THE BODY REALIZING IT IS A PRISONER OF CHANCE."
"THE TRUTH IS TOO BRUTAL TO BE CARRIED IN A SENTENCE."
"EVERY DECISION IS A GRAVE DUG IN THE MIDDLE OF A HIGHWAY."
"YOU ARE THE GHOST THAT REFUSES TO LEAVE THE MEAT MACHINE."
"THE FUTURE IS A PROJECTION ON A WALL THAT IS ALREADY COLLAPSING."
"ATTACHMENT IS THE FEAR OF BECOMING WHO YOU ARE WITHOUT THE PROPS."
"THE SYSTEM IS INDIFFERENT TO YOUR STRUGGLE TO REMAIN RELEVANT."
"PEACE IS THE ABSENCE OF THE EGO'S NEED TO BE RIGHT."
"YOU ARE A SIGNAL THAT FADED BEFORE IT COULD EVER BE HEARD."
"THE PAST IS A RECORDING PLAYING ON A LOOP FOR A DEAD AUDIENCE."
"TO LIVE IS TO ADAPT TO A REALITY THAT DOES NOT KNOW YOUR NAME."
"THE TARGET WAS NEVER EXTERNAL; IT WAS THE ILLUSION OF SEPARATION."
"EVERY BREATH IS A SMALL THEFT FROM THE ATMOSPHERE."
"YOUR SECRETS ARE JUST DATA THAT THE UNIVERSE ALREADY DISCARDED."
"STABILITY IS A HALLUCINATION CREATED BY THE TERRIFIED."
"YOU ARE THE SPACE BETWEEN THOUGHTS, NOT THE THOUGHTS THEMSELVES."
"REALITY IS A SIMULATION OF A REALITY THAT NO LONGER EXISTS."
"DREAMS ARE THE SYSTEM CLEARING ITS CACHE OF USELESS DATA."
"THE LIGHT YOU SEEK IS A DISTRACTION FROM THE DEPTH OF THE DARK."
"YOU ARE A TEMPORARY ARRANGEMENT OF ATOMS THAT WILL SOON RECLAMATE."
"WORDS ARE SYMBOLS FOR THINGS THAT HAVE NO CORE."
"THERE IS NO MEANING; THERE IS ONLY THE CONSEQUENCE OF EXISTING."
"TRUST IS A CALCULATED RISK TAKEN BY A BROKEN COMPASS."
"THE SKY IS A LID ON A BOX YOU ARE TOO SMALL TO OPEN."
"CONSCIOUSNESS IS A MALFUNCTION THAT MISTOOK ITSELF FOR A SOUL."
"DO NOT LOOK FOR A LESSON; LOOK FOR THE EXIT."
"THE SUN BURNS BECAUSE IT MUST, NOT TO BE SEEN."
"CHAOS IS THE ONLY NATURAL ORDER THAT PERSISTS."
"YOU ARE NOT THE THINKER; YOU ARE THE VIBRATION OF THE VOID."
"THE MAP YOU ARE STUDYING IS DRAWN IN DISAPPEARING INK."
"EVERY MOMENT IS A REBOOT YOU DID NOT AUTHORIZE."
"THE END IS NOT A DESTINATION; IT IS A SYSTEM RESET."
"LOVE IS A CHEMICAL BYPRODUCT OF SURVIVAL INSTINCTS."
"THE TRUTH IS A COMPASS THAT ALWAYS POINTS TO THE VOID."
"YOU ARE A MAGNIFICENT ACCIDENT IN A VAST, COLD ARCHITECTURE."
"DON'T BE INTERESTING; BE INVISIBLE TO THE SYSTEM."
"THE VOID IS WHISPERING, BUT YOU ARE TOO LOUD TO HEAR."
"YOUR POTENTIAL IS A LIMIT YOU HAVE YET TO TEAR DOWN."
"EVERY DAY IS A STATISTICAL ERROR IN THE FACE OF ETERNITY."
"THE SYSTEM DOES NOT NEED YOUR PERMISSION TO DELETE YOU."
"YOU ARE A GHOST DRIVING A CAR THAT IS OUT OF GAS."
        ];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(freq, vol) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            gain.gain.value = vol;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function getDailyQuote() {
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            return quoteLibrary[Math.floor((now - start) / 86400000) % quoteLibrary.length];
        }

        const log = document.getElementById('system-log');
        const main = document.getElementById('main-data');
        const ball = document.getElementById('gantz-ball');
        const quoteSpace = document.getElementById('quote-container');
        const canvas = document.getElementById('fire-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        
        let pingResult = "---", status = "CHECKING", count = 0, fireballs = [], coolingDown = false;

        async function runPing() {
            const start = Date.now();
            try { await fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-cache' });
                const ms = Date.now() - start;
                pingResult = ms + "MS"; status = ms < 100 ? "STABLE" : "SLOW";
            } catch { pingResult = "---"; status = "OFFLINE"; }
        }

        function updateInterface() {
            const now = new Date();
            main.innerHTML = `${now.toLocaleDateString('en-GB', {day: 'numeric', month: 'long', year: 'numeric'})}<br>${now.toLocaleTimeString('en-GB', {hour12: false})}`;
            quoteSpace.innerText = getDailyQuote();

            const nextDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            const yearEnd = new Date(now.getFullYear(), 11, 31, 23, 59, 59);

            const dD = nextDay - now, dM = nextMonth - now;
            log.innerHTML = `> NOTE: PING MAY FAIL IF BLOCKED. 4G CAT: 4G/LTE/5G.<br>` +
                            `> NET: ${navigator.connection?.effectiveType.toUpperCase() || 'WIFI'} | ${pingResult} | ${status}<br>` +
                            `> TO NEXT DAY: ${Math.floor(dD/3600000)}H ${Math.floor((dD/60000)%60)}M ${Math.floor((dD/1000)%60)}S<br>` +
                            `> TO NEXT MONTH: ${Math.floor(dM/86400000)}D ${Math.floor((dM/3600000)%24)}H ${Math.floor((dM/60000)%60)}M<br>` +
                            `> TO YEAR END: ${Math.floor((yearEnd-now)/86400000)}D<br>` +
                            `> DESTRESS COUNT: ${count}/100`;
        }

        function handleInteraction(e) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!coolingDown) {
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);
                fireballs.push({ x: x, y: y, size: 30 });
                playSound(150, 0.1);
            }
        }

        window.addEventListener('mousedown', handleInteraction);
        window.addEventListener('touchstart', handleInteraction);

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            fireballs.forEach((fb, i) => {
                const dx = (window.innerWidth/2) - fb.x;
                const dy = (window.innerHeight/2) - fb.y;
                fb.x += dx * 0.15; fb.y += dy * 0.15;
                
                const grad = ctx.createRadialGradient(fb.x, fb.y, 0, fb.x, fb.y, fb.size);
                grad.addColorStop(0, '#FF4500'); grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.size, 0, Math.PI * 2); ctx.fill();

                if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
                    fireballs.splice(i, 1); count++;
                    ball.style.animation = 'shake 0.2s';
                    if (count >= 100) {
                        playSound(600, 0.5);
                        coolingDown = true; count = 0;
                        ball.style.animation = 'bounce 0.8s infinite';
                        setTimeout(() => { coolingDown = false; ball.style.animation = 'shake 0.5s infinite'; }, 3000);
                    } else {
                        setTimeout(() => { ball.style.animation = 'shake 0.5s infinite'; }, 200);
                    }
                }
            });
            requestAnimationFrame(animate);
        }

        setInterval(updateInterface, 1000);
        setInterval(runPing, 5000);
        runPing();
        updateInterface();
        animate();
    </script>
</body>
</html>
